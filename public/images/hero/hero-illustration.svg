<svg xmlns="http://www.w3.org/2000/svg" width="480" height="480" viewBox="0 0 480 480">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#53DBC7"/>
      <stop offset="100%" stop-color="#7B55E5"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E6FAF6"/>
      <stop offset="100%" stop-color="#EFE9FD"/>
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="240" cy="260" r="180" fill="url(#g2)" opacity="0.6"/>

  <!-- Bottom book (largest) -->
  <rect x="100" y="310" width="280" height="36" rx="8" fill="#7B55E5"/>
  <rect x="108" y="316" width="264" height="24" rx="6" fill="#9070EA"/>
  <rect x="100" y="310" width="18" height="36" rx="4" fill="#5A3DC8"/>

  <!-- Middle book -->
  <rect x="120" y="270" width="240" height="44" rx="8" fill="#53DBC7"/>
  <rect x="128" y="278" width="224" height="28" rx="6" fill="#72E4D2"/>
  <rect x="120" y="270" width="18" height="44" rx="4" fill="#2FB8A2"/>
  <text x="200" y="298" font-family="Georgia, serif" font-size="12" fill="white" opacity="0.8">The Little Lantern</text>

  <!-- Top book -->
  <rect x="140" y="225" width="200" height="50" rx="8" fill="#FF8FAB"/>
  <rect x="148" y="233" width="184" height="34" rx="6" fill="#FFA5BE"/>
  <rect x="140" y="225" width="18" height="50" rx="4" fill="#E06080"/>
  <text x="210" y="255" font-family="Georgia, serif" font-size="11" fill="white" opacity="0.8">Wonder Words</text>

  <!-- Sparkle stars -->
  <circle cx="370" cy="200" r="6" fill="#53DBC7"/>
  <line x1="370" y1="188" x2="370" y2="212" stroke="#53DBC7" stroke-width="2"/>
  <line x1="358" y1="200" x2="382" y2="200" stroke="#53DBC7" stroke-width="2"/>

  <circle cx="110" cy="230" r="5" fill="#7B55E5"/>
  <line x1="110" y1="219" x2="110" y2="241" stroke="#7B55E5" stroke-width="2"/>
  <line x1="99" y1="230" x2="121" y2="230" stroke="#7B55E5" stroke-width="2"/>

  <!-- Tiny planet -->
  <circle cx="390" cy="310" r="28" fill="url(#g1)" opacity="0.7"/>
  <ellipse cx="390" cy="310" rx="42" ry="10" fill="none" stroke="#7B55E5" stroke-width="3" opacity="0.5"/>

  <!-- Floating dots -->
  <circle cx="150" cy="190" r="8" fill="#E6FAF6"/>
  <circle cx="340" cy="380" r="10" fill="#EFE9FD"/>
  <circle cx="80" cy="330" r="6" fill="#53DBC7" opacity="0.4"/>
  <circle cx="410" cy="240" r="7" fill="#7B55E5" opacity="0.3"/>
</svg>
